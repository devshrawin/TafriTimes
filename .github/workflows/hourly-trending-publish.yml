name: Hourly trending publish (archives + posts to Instagram)

# Runs generate -> judge -> guardrail -> render -> archive -> post, once an
# hour (roughly 24/day), against a real trending India headline (see
# scripts/fetch-trending.mjs and PLAN.md's "Real trending event mode"
# section). Posts automatically to whichever platforms have credentials
# configured (see post-published.mjs's per-platform check) -- currently
# Instagram only; X will start working the moment its four secrets are
# added, with no further change needed here.
#
# Scheduling approach ported from the NewsDigest project's check-feeds.yml,
# which hit this exact problem first: GitHub's `schedule:` trigger is
# best-effort with no SLA and no catch-up for a dropped tick — that project
# measured a single *hourly* cron going 4+ hours with zero fires. Their fix,
# reused here: one long-lived job loops internally via a plain bash `sleep`
# for the real ~hourly cadence (not dependent on GitHub's scheduler once
# started), with only a coarse `schedule:` trigger (every 6h) to restart the
# chain if a job ever dies. Coarse, infrequent triggers are far less prone to
# the congestion/drop behavior that killed the frequent version.
on:
  workflow_dispatch:
  schedule:
    # Tightened 6h -> 4h to comfortably fit inside a single job's ~5h20m
    # budget at the current 2h post interval -- a restart landing well
    # before the previous job's budget runs out keeps the gap between
    # posts close to 2h even across a restart boundary.
    - cron: "17 */4 * * *" # coarse restart-the-chain trigger, not the real cadence

permissions:
  contents: write
  issues: write

concurrency:
  group: hourly-trending-publish
  # true, not false: each loop iteration is a fully independent publish, so
  # if the 6-hourly restart fires while a previous loop is still alive,
  # cancelling it and starting fresh loses at most one in-flight iteration
  # (worst case: one wasted LLM call, or one skipped post) and never
  # corrupts anything.
  cancel-in-progress: true

jobs:
  publish-loop:
    runs-on: ubuntu-latest
    # Comfortably under GitHub's 6h hard cap on hosted-runner job duration.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Loop publish + post every ~2 hours
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2026-08-16: cut from 24/day to ~3/day first (reach suppression,
          # repetition visibility -- see PROGRESS.md), then raised back to
          # ~12/day (1 every 2h) per owner request once the content-quality
          # fixes (format rotation, quality floor, anti-repetition) were in
          # place. Raised 8->14 same day: owner found only ~2/10 published
          # pieces actually funny -- more candidates per judged batch is one
          # of the two levers pulled for that (the other is the judge
          # prompt's new "AI comedy tells" section, see judge.system.md).
          # Gemini's real free-tier cap, confirmed live the same day via an
          # actual 429 quota error, is 500 req/day per project per model --
          # NOT the 1,500 this repo assumed earlier (never verified live,
          # wrong). 12/day x ~16-18 calls/post (14 generate + judge + 1-3
          # safety/regenerate) is ~200-215/day, under half of the real 500
          # cap -- fine for the workflow alone, but manual local testing
          # against the same GEMINI_API_KEY on the same day eats into this
          # same daily budget and can 429 both.
          CANDIDATE_COUNT: "14"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          # GitHub Actions' default bash shell already runs every `run:`
          # step as `bash -eo pipefail {0}` -- errexit is ON from the
          # runner's own invocation before this line ever executes. A live
          # run confirmed this the hard way: a transient Gemini 503 killed
          # the whole step in 29s, before any of the error-handling logic
          # below ever ran, because `set -uo pipefail` only ADDS `-u` and
          # reaffirms pipefail -- it does not (and cannot) turn off an `-e`
          # that was already active. `set +e` explicitly is required.
          set +e
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"
          INTERVAL=$(( 2 * 3600 ))  # ~12 posts/day (1 every 2h) -- see CANDIDATE_COUNT comment above for why
          RESERVE=$(( 5 * 60 )) # publish.mjs + post-published.mjs run in well under a minute combined in testing
          RUN_CAP=5m         # hard ceiling on one publish.mjs run
          POST_CAP=5m        # hard ceiling on one post-published.mjs run (was unbounded -- a single hung socket could stall the whole job for hours)

          # 5h20m of looping -- leaves ~20min of the 350min job budget free
          # for the last iteration's own commit/push to finish cleanly.
          END=$(( $(date +%s) + 5*3600 + 20*60 ))

          # Audited live (2026-08-15): a stretch of posting failures caused
          # the loop to archive a brand-new post every ~3 minutes instead of
          # slowing down -- because a posting failure retried by generating
          # FRESH content next iteration, not by retrying the post for what
          # was already archived. 77 posts got archived in ~36 hours while
          # only ~10 ever made it to Instagram. PENDING_DIR carries an
          # already-archived-but-unposted dirName across iterations so a
          # posting failure retries POSTING THE SAME POST, not generation.
          PENDING_DIR=""
          POST_RETRY_COUNT=0
          MAX_POST_RETRIES=5

          while true; do
            ITER_START=$(date +%s)
            run_ok=1
            should_attempt_post=0
            DIR_NAME=""

            if [ -n "$PENDING_DIR" ]; then
              DIR_NAME="$PENDING_DIR"
              should_attempt_post=1
              echo "Retrying post for previously-archived ${DIR_NAME} (post attempt $((POST_RETRY_COUNT + 1))/${MAX_POST_RETRIES}) -- not generating new content this iteration."
            else
              # With -e off (see above), a failing publish.mjs falls through
              # to the commit logic below rather than aborting the whole loop
              # -- one bad run (a Gemini 503, a Pollinations timeout) shouldn't
              # kill a 5h20m loop.
              #
              # Deliberately NOT `if ! timeout ...; then code=$?; fi` -- bash's
              # `!` negates the exit status used for the `if` test itself, so
              # `$?` inside that block is always 0 or 1 (the negated result),
              # never the command's real exit code. That silently broke the
              # `code = "3"` clean-skip check below and misreported real
              # failures as "exit 0" -- run the command plain and read $? right
              # after instead.
              timeout "${RUN_CAP}" node scripts/publish.mjs > publish-result.json
              code=$?
              if [ "$code" -ne 0 ]; then
                if [ "$code" = "3" ]; then
                  echo "Guardrail blocked/exhausted this iteration -- nothing to archive, that's fine."
                else
                  run_ok=0
                  echo "::warning::publish.mjs failed or exceeded ${RUN_CAP} this iteration (exit ${code}) -- will retry next iteration"
                fi
              fi

              if [ "$run_ok" -eq 1 ]; then
                DIR_NAME="$(node -e "const r=require('./publish-result.json'); console.log(r.dirName ?? '')")"
              fi

              # Audited 2026-08-16: a guardrail block/regenerate-exhausted
              # (code=3) left run_ok=1 with an EMPTY DIR_NAME. publish.mjs
              # still marks the trending headline used even when blocked
              # (deliberately, so a bad headline isn't retried forever), so
              # `data/trending-used.json` had a real change -- `git diff
              # --staged` was non-empty, the commit+push succeeded, and
              # `should_attempt_post` got set to 1 with DIR_NAME="". Posting
              # with an empty ARCHIVE_DIR_NAME always failed, which set
              # run_ok=0 and dropped into the 3-minute fast-retry -- so
              # every guardrail block silently turned into rapid-fire fresh
              # generation instead of the intended hourly cadence. This is
              # what actually produced 44 posts in one day. Guarding the
              # whole block on a non-empty DIR_NAME closes it: a real
              # block/exhausted iteration is now a true no-op at normal
              # cadence, exactly as the log message above always claimed.
              if [ "$run_ok" -eq 1 ] && [ -n "$DIR_NAME" ]; then
                node scripts/build-gallery.mjs || echo "::warning::gallery build failed -- archive still committed below, gallery just won't reflect this iteration yet"
                git add content/archive data/trending-used.json docs
                if git diff --staged --quiet; then
                  echo "No change this iteration -- nothing to commit."
                elif ! git commit -m "Hourly trending archive $(date -u '+%Y-%m-%d %H:%M UTC')"; then
                  echo "::warning::git commit failed -- nothing delivered this iteration"
                  run_ok=0
                else
                  # content/archive and data/trending-used.json only ever grow
                  # (new dirs, appended log entries) -- no meaningful merge, so
                  # don't rebase: on rejection, stash what this iteration built,
                  # hard-reset onto origin, restore it, and re-commit. Avoids a
                  # mid-rebase tree that could break every later iteration.
                  pushed=0
                  for attempt in 1 2 3; do
                    if git push origin "HEAD:${BRANCH}"; then
                      pushed=1
                      break
                    fi
                    echo "Push rejected (attempt ${attempt}/3) -- replaying this iteration's output onto origin/${BRANCH}."
                    TMP="$(mktemp -d)"
                    cp -r content/archive "$TMP/archive" 2>/dev/null || true
                    cp data/trending-used.json "$TMP/trending-used.json" 2>/dev/null || true
                    if ! git fetch origin "${BRANCH}"; then
                      echo "::warning::fetch failed -- keeping local commit, will retry next iteration"
                      rm -rf "$TMP"; break
                    fi
                    if ! git reset --hard "origin/${BRANCH}"; then
                      echo "::warning::reset to origin/${BRANCH} failed -- leaving tree as-is for the next iteration"
                      rm -rf "$TMP"; break
                    fi
                    mkdir -p content/archive
                    cp -r "$TMP/archive/." content/archive/ 2>/dev/null || true
                    [ -f "$TMP/trending-used.json" ] && cp "$TMP/trending-used.json" data/trending-used.json
                    rm -rf "$TMP"
                    # Rebuild docs/ from the now-restored content/archive rather
                    # than trying to stash/replay the docs tree itself --
                    # index.html and the images/ copies are always fully
                    # regenerated from content/archive anyway, so this keeps
                    # them consistent instead of risking a stale docs snapshot.
                    node scripts/build-gallery.mjs || true
                    git add content/archive data/trending-used.json docs
                    if git diff --staged --quiet; then
                      echo "Origin already matches this iteration's output -- nothing to re-commit."
                      pushed=1
                      break
                    fi
                    git commit -m "Hourly trending archive $(date -u '+%Y-%m-%d %H:%M UTC')" || {
                      echo "::warning::re-commit after replay failed"; break; }
                  done

                  git fetch origin "${BRANCH}" >/dev/null 2>&1 || true
                  if [ "$pushed" -eq 1 ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${BRANCH}")" ]; then
                    echo "Archive pushed and verified on origin/${BRANCH}."
                    should_attempt_post=1
                  else
                    echo "::warning::this iteration's archive was not delivered -- skipping post attempt (image not confirmed on origin), next iteration's git state will still include it locally"
                    run_ok=0
                  fi
                fi
              fi
            fi

            if [ "$should_attempt_post" -eq 1 ]; then
              # Purge jsDelivr's CDN mirror of the image we just pushed --
              # Instagram's media container fetch depends on that mirror
              # being fresh (see PLAN.md §4). Best-effort: a purge failure
              # shouldn't block the post attempt below.
              curl -s --max-time 10 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/content/archive/${DIR_NAME}/image.png" >/dev/null 2>&1 || true

              # post-published.mjs itself skips any platform whose
              # credentials aren't fully configured (see its hasAllEnv
              # check) -- X's four secrets are wired into this step's env
              # above but currently unset, so this posts to Instagram
              # only until X is set up, with no further workflow change
              # needed then.
              #
              # Wrapped in `timeout` -- this call had no bound at all before
              # (audited 2026-08-16): a hung socket inside it could stall the
              # whole 5h20m job silently until the runner's own
              # timeout-minutes cap eventually killed it.
              timeout "${POST_CAP}" env ARCHIVE_DIR_NAME="$DIR_NAME" node scripts/post-published.mjs > post-result.json
              post_code=$?
              if [ "$post_code" -ne 0 ]; then
                POST_RETRY_COUNT=$((POST_RETRY_COUNT + 1))
                if [ "$POST_RETRY_COUNT" -ge "$MAX_POST_RETRIES" ]; then
                  echo "::warning::giving up posting ${DIR_NAME} after ${POST_RETRY_COUNT} attempts -- it stays archived but unposted; resuming normal generation next iteration"
                  # Real alerting, not just an annotation nobody watches --
                  # see refresh-instagram-token.yml for the same pattern.
                  # Best-effort: GH_TOKEN comes from the default token (gh
                  # is preinstalled on ubuntu-latest), a failure here must
                  # never block the loop from moving on.
                  GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" bash -c '
                    TITLE="Post abandoned after max retries: '"${DIR_NAME}"'"
                    BODY="'"${DIR_NAME}"' failed to post to every configured platform after '"${POST_RETRY_COUNT}"' attempts and was abandoned (stays archived, unposted). Check the run: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"'"
                    gh issue create --title "$TITLE" --body "$BODY"
                  ' || echo "::warning::failed to open an alert issue for the abandoned post -- continuing anyway"
                  PENDING_DIR=""
                  POST_RETRY_COUNT=0
                  # run_ok deliberately left at 1 here: a single unpostable
                  # item shouldn't stall the whole pipeline in a permanent
                  # 3-minute fast-retry loop -- move on at the normal cadence.
                else
                  PENDING_DIR="$DIR_NAME"
                  run_ok=0
                  echo "::warning::post-published.mjs failed (exit ${post_code}), attempt ${POST_RETRY_COUNT}/${MAX_POST_RETRIES} -- archive is safe; will retry POSTING THIS SAME ARCHIVED POST in 3 minutes, not generate new content"
                fi
              else
                PENDING_DIR=""
                POST_RETRY_COUNT=0
                git add content/archive
                if git diff --staged --quiet; then
                  echo "No post IDs to record (nothing was posted this iteration)."
                elif ! git commit -m "Record post IDs: ${DIR_NAME}"; then
                  echo "::warning::commit of post IDs failed"
                else
                  post_pushed=0
                  for attempt in 1 2 3; do
                    if git push origin "HEAD:${BRANCH}"; then
                      post_pushed=1
                      break
                    fi
                    echo "Push rejected (attempt ${attempt}/3) -- replaying post-IDs commit onto origin/${BRANCH}."
                    TMP="$(mktemp -d)"
                    cp -r content/archive "$TMP/archive" 2>/dev/null || true
                    if ! git fetch origin "${BRANCH}"; then
                      echo "::warning::fetch failed -- keeping local commit, will retry next iteration"
                      rm -rf "$TMP"; break
                    fi
                    if ! git reset --hard "origin/${BRANCH}"; then
                      echo "::warning::reset to origin/${BRANCH} failed -- leaving tree as-is for the next iteration"
                      rm -rf "$TMP"; break
                    fi
                    mkdir -p content/archive
                    cp -r "$TMP/archive/." content/archive/ 2>/dev/null || true
                    rm -rf "$TMP"
                    git add content/archive
                    if git diff --staged --quiet; then
                      echo "Origin already matches -- nothing to re-commit."
                      post_pushed=1
                      break
                    fi
                    git commit -m "Record post IDs: ${DIR_NAME}" || {
                      echo "::warning::re-commit of post IDs after replay failed"; break; }
                  done
                  if [ "$post_pushed" -eq 1 ]; then
                    echo "Post IDs recorded and pushed."
                  else
                    echo "::warning::post IDs commit was not delivered -- next iteration's git state will still include it locally"
                  fi
                fi
              fi
            fi

            # Cadence measured from iteration START so work time doesn't
            # stack on top of the sleep. A failed iteration (run_ok=0 --
            # Gemini 503, Pollinations timeout, a posting failure under the
            # retry cap, etc.) retries every 3 minutes instead of waiting
            # out the full hour -- once an iteration actually succeeds (or
            # a stuck post is abandoned after MAX_POST_RETRIES), cadence
            # goes back to the normal ~hourly interval.
            NOW=$(date +%s)
            ELAPSED=$(( NOW - ITER_START ))
            if [ "$run_ok" -eq 0 ]; then
              SLEEP=$(( 3 * 60 ))
              echo "Iteration failed -- retrying in ${SLEEP}s instead of waiting the full interval."
            else
              SLEEP=$(( INTERVAL - ELAPSED ))
              [ "$SLEEP" -lt 60 ] && SLEEP=60
            fi

            if [ $(( NOW + SLEEP + RESERVE )) -ge "$END" ]; then
              echo "Not enough budget left for another full iteration -- the next restart picks up from here."
              break
            fi
            echo "Sleeping ${SLEEP}s (iteration took ${ELAPSED}s)."
            sleep "$SLEEP"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Hourly trending publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f publish-result.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -30 publish-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No publish-result.json produced -- check the loop step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f post-result.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -30 post-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
