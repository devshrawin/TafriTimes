name: Refresh Instagram token

on:
  schedule:
    - cron: "0 4 * * 1" # weekly, well inside the 60-day expiry window
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Refresh long-lived token and write back as a repo secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT_FOR_SECRETS: ${{ secrets.GH_PAT_FOR_SECRETS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/refresh-instagram-token.mjs
