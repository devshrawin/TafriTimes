name: Daily publish (POSTS TO SOCIAL — manual trigger only)

# THIS IS THE ONLY WORKFLOW THAT POSTS TO X AND INSTAGRAM.
#
# The `schedule:` trigger was REMOVED deliberately (2026-08-14 audit). It
# previously ran daily at 05:30 UTC, and its posting steps were gated on
# `github.event.inputs.dry_run != 'true'` — but on a `schedule:` trigger
# `inputs` is empty, so that condition evaluated TRUE and a scheduled run
# took the posting path by default. The gate is now `post == 'true'`, so
# the default is fail-safe: absent/empty input means archive only. The only thing preventing unreviewed
# autonomous posting was that the workflow passed ANTHROPIC_API_KEY while
# the code requires GEMINI_API_KEY, so it crashed at step one every morning.
# Fixing that env-var name — an obvious-looking one-line bug — would have
# silently switched on live posting to X and Instagram.
#
# Posting is intentionally deferred until after the archive-only test phase.
# Day-to-day generation runs in hourly-trending-publish.yml, which never
# posts. Re-enabling a schedule here is a deliberate decision, not a fix.
#
# `post` now defaults to "false", so even a manual run archives without
# posting unless someone explicitly asks for it.

on:
  workflow_dispatch:
    inputs:
      topic_key:
        description: "Force a specific topic beat (config/topics.yaml key). Leave blank for weighted random."
        required: false
      post:
        description: "Set to 'true' to ACTUALLY POST to X and Instagram. Anything else archives only."
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Phase 1: generate -> judge -> safety guardrail (bounded regenerate
      # loop) -> render templated image -> write to content/archive/. Exit
      # code 3 means the guardrail blocked the topic or exhausted regenerate
      # retries — a clean no-publish exit, not a workflow failure.
      - name: Generate, judge, guardrail, render, archive
        id: archive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_KEY: ${{ github.event.inputs.topic_key }}
        run: |
          set +e
          node scripts/publish.mjs > archive-result.json
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            exit "$code"
          fi
          echo "archived=$(node -e "console.log(require('./archive-result.json').archived)")" >> "$GITHUB_OUTPUT"
          echo "dir_name=$(node -e "const r=require('./archive-result.json'); console.log(r.dirName ?? '')")" >> "$GITHUB_OUTPUT"

      # Commit + push so the image is on `main` before Instagram's Graph API
      # tries to fetch it via the jsDelivr CDN mirror (see PLAN.md §4).
      - name: Commit archive
        if: steps.archive.outputs.archived == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/archive
          git diff --staged --quiet || git commit -m "Archive: ${{ steps.archive.outputs.dir_name }}"
          git push

      - name: Purge jsDelivr cache for new image
        if: steps.archive.outputs.archived == 'true' && github.event.inputs.post == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/content/archive/${{ steps.archive.outputs.dir_name }}/image.png" || true

      # Phase 2: post to X (direct byte upload, no CDN dependency) and
      # Instagram (needs the push above to have landed first).
      - name: Post to X and Instagram
        if: steps.archive.outputs.archived == 'true' && github.event.inputs.post == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ARCHIVE_DIR_NAME: ${{ steps.archive.outputs.dir_name }}
        run: node scripts/post-published.mjs > post-result.json

      # Persist the tweet/media IDs written into article.json by
      # post-published.mjs, so collect-engagement.yml can find them later.
      - name: Commit post IDs
        if: steps.archive.outputs.archived == 'true' && github.event.inputs.post == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/archive
          git diff --staged --quiet || git commit -m "Record post IDs: ${{ steps.archive.outputs.dir_name }}"
          git push

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-run
          path: |
            archive-result.json
            post-result.json
          if-no-files-found: ignore
